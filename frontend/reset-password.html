<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifre Sıfırlama</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <h1>Şifre Sıfırlama</h1>
    <p class="subtitle">Önce sıfırlama kodu isteyin, ardından yeni şifrenizi belirleyin.</p>
    <form id="requestResetForm" novalidate>
      <div class="field">
        <label for="email">Kayıtlı E-posta</label>
        <input id="email" name="email" type="email" required placeholder="ornek@mail.com" />
      </div>
      <button type="submit">Sıfırlama Kodu Gönder</button>
    </form>

    <form id="confirmResetForm" style="margin-top: 20px;" novalidate>
      <div class="field">
        <label for="token">Sıfırlama Kodu</label>
        <input id="token" name="token" type="text" required placeholder="Sıfırlama token" />
      </div>
      <div class="field">
        <label for="newPassword">Yeni Şifre</label>
        <input id="newPassword" name="newPassword" type="password" required minlength="6" placeholder="En az 6 karakter" />
      </div>
      <button type="submit">Şifreyi Güncelle</button>
      <div id="resetMessage" class="message" role="alert"></div>
    </form>

    <div class="links">
      <a href="/login.html">Giriş Ekranına Dön</a>
      <a href="/register.html">Kayıt Ol</a>
    </div>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
